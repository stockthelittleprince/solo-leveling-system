<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System</title>
    <style>
        :root {
            --panel-bg: rgba(5, 10, 20, 0.92);
            --panel-border: #00f0ff;
            --panel-glow: rgba(0, 240, 255, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #030712;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 16, 0.88);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 模仿我獨自升級彈窗 Notification 風格 */
        .system-notification {
            background: var(--panel-bg);
            border: 2px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 0 30px var(--panel-glow), inset 0 0 25px rgba(0, 240, 255, 0.1);
            position: relative;
        }

        /* 模仿截圖中的雙層框線與角落裝飾 */
        .system-notification::before {
            content: "";
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
            pointer-events: none;
        }

        .notif-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .notif-icon {
            border: 1px solid var(--accent-cyan);
            border-radius: 50%;
            width: 28px; height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-weight: bold;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .notif-title {
            color: var(--accent-cyan);
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .quest-title {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            background-color: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            height: 10px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #0284c7, var(--accent-cyan));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .task-box {
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95krem;
        }

        .task-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 100%;
            margin-top: 8px;
            background: #020617;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid var(--accent-cyan);
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .btn-rest {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
            margin-top: 6px;
        }

        .btn-rest:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 狀態列 -->
        <div class="system-notification" style="padding: 15px 20px;">
            <div class="status-row">
                <span style="color: var(--accent-cyan); font-weight: bold;">[ PLAYER LV. 07 ]</span>
                <span>EXP 72%</span>
            </div>
            <div class="progress-bar-bg" style="margin-top: 8px; margin-bottom: 0;">
                <div class="progress-bar-fill" style="width: 72%;"></div>
            </div>
        </div>

        <!-- 每日任務與習慣視窗 -->
        <div class="system-notification">
            <div class="notif-header">
                <div class="notif-icon">!</div>
                <div class="notif-title">NOTIFICATION</div>
            </div>
            
            <div class="quest-title">[ Daily Quests & Habits ]</div>

            <!-- 冥想 -->
            <div class="task-box">
                <div class="task-item">
                    <input type="checkbox" id="task-meditation">
                    <label for="task-meditation">🧘‍♂️ 冥想 (10 MIN)</label>
                </div>
            </div>

            <!-- 柔術影片 -->
            <div class="task-box">
                <div class="task-item">
                    <input type="checkbox" id="task-bjj">
                    <label for="task-bjj">🥋 柔術影片學習 (30 MIN)</label>
                </div>
                <input type="text" placeholder="輸入今天學習心得或動作筆記...">
            </div>

            <!-- 體能訓練進度 -->
            <div style="margin-top: 15px; border-top: 1px solid rgba(0,240,255,0.2); padding-top: 12px;">
                <div class="status-row"><span>HAND (手)</span><span id="hand-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="hand-bar" style="width: 0%;"></div></div>
                
                <div class="status-row"><span>LEG (腿)</span><span id="leg-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="leg-bar" style="width: 0%;"></div></div>
                
                <div class="status-row"><span>CORE + CARDIO (核心+有氧)</span><span id="core-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="core-bar" style="width: 0%;"></div></div>
                
                <div class="status-row" style="margin-top: 10px; font-weight: bold; color: var(--accent-cyan);">
                    <span>TOTAL TRAINING: <span id="total-training">0</span> / 6</span>
                    <span>REST: <span id="rest-count">0</span> / 1</span>
                </div>

                <button class="btn" onclick="completeTraining()">COMPLETE TRAINING</button>
                <button class="btn btn-rest" onclick="enterRestMode()">ENTER REST MODE (休息)</button>
            </div>
        </div>
    </div>

    <script>
        let stats = { hand: 0, leg: 0, core: 0, rest: 0 };
        function completeTraining() {
            if (stats.hand < 2) {
                stats.hand++;
                document.getElementById('hand-count').innerText = stats.hand + " / 2";
                document.getElementById('hand-bar').style.width = (stats.hand / 2 * 100) + "%";
            } else if (stats.leg < 2) {
                stats.leg++;
                document.getElementById('leg-count').innerText = stats.leg + " / 2";
                document.getElementById('leg-bar').style.width = (stats.leg / 2 * 100) + "%";
            } else if (stats.core < 2) {
                stats.core++;
                document.getElementById('core-count').innerText = stats.core + " / 2";
                document.getElementById('core-bar').style.width = (stats.core / 2 * 100) + "%";
            }
            document.getElementById('total-training').innerText = (stats.hand + stats.leg + stats.core);
            alert("SYSTEM: 訓練項目已完成，EXP +100");
        }

        function enterRestMode() {
            if (stats.rest < 1) {
                stats.rest++;
                document.getElementById('rest-count').innerText = stats.rest;
                alert("⚠ REST MODE ACTIVATED: 今日訓練已順延。");
            } else {
                alert("本週休息額度已用完！");
            }
        }
    </script>
</body>
</html>
