<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System</title>
    <style>
        :root {
            --system-bg: rgba(8, 15, 30, 0.9);
            --panel-border: #00f0ff;
            --panel-glow: rgba(0, 240, 255, 0.3);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-glow-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* 讀取你上傳的 bg.jpg 背景圖 */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #030712;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* 增加一層半透明遮罩，讓面板和字體更清晰突顯 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 系統面板風格：類似我獨自升級的藍光邊框視窗 */
        .panel {
            background-color: var(--system-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 0 20px var(--panel-glow), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
        }

        .panel::after {
            content: "";
            position: absolute;
            bottom: 0; right: 0;
            width: 10px; height: 10px;
            border-right: 2px solid var(--accent-cyan);
            border-bottom: 2px solid var(--accent-cyan);
        }

        .header-panel {
            border-left: 5px solid var(--accent-cyan);
        }

        h1, h2, h3 {
            color: var(--accent-cyan);
            font-size: 1.1rem;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .progress-bar-bg {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            height: 12px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #0284c7, var(--accent-cyan));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .task-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid var(--accent-cyan);
            padding: 12px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .btn-rest {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
        }

        .btn-rest:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .activity-cell {
            background-color: rgba(15, 23, 42, 0.8);
            aspect-ratio: 1;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .activity-cell.active {
            background-color: #10b981;
            border-color: #34d399;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .day-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SYSTEM STATUS -->
        <div class="panel header-panel">
            <h1>⚔ SOLO LEVELING SYSTEM</h1>
            <div class="status-row">
                <span>PLAYER LV. 07</span>
                <span>EXP 72%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 72%;"></div>
            </div>
        </div>

        <!-- DYNAMIC WEEKLY & TODAY PANEL -->
        <div id="app-content"></div>

        <!-- ACTIVITY CONTRIBUTION -->
        <div class="panel">
            <h3>ACTIVITY CONTRIBUTION</h3>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px;">
                <div class="day-label">MON</div>
                <div class="day-label">TUE</div>
                <div class="day-label">WED</div>
                <div class="day-label">THU</div>
                <div class="day-label">FRI</div>
                <div class="day-label">SAT</div>
                <div class="day-label">SUN</div>
            </div>
            <div class="activity-grid" id="activity-grid">
                <div class="activity-cell"></div>
                <div class="activity-cell"></div>
                <div class="activity-cell"></div>
                <div class="activity-cell"></div>
                <div class="activity-cell"></div>
                <div class="activity-cell active"></div>
                <div class="activity-cell"></div>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const dayOfWeek = now.getDay(); 
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        const dateString = now.toLocaleDateString('en-US', options).toUpperCase();

        const contentDiv = document.getElementById('app-content');

        if (dayOfWeek === 6 || dayOfWeek === 0) {
            contentDiv.innerHTML = `
                <div class="panel">
                    <h3>SYSTEM STATUS</h3>
                    <div style="font-size: 1.1rem; color: #fff; margin: 15px 0; text-align: center;">
                        NEXT WEEK QUEST<br><br>
                        <strong style="color: var(--accent-cyan); font-size: 1.3rem; text-shadow: 0 0 10px var(--accent-cyan);">MON 09.14 INITIALIZING...</strong>
                    </div>
                    <div class="status-row"><span>HAND (手)</span><span>0 / 2</span></div>
                    <div class="status-row"><span>LEG (腿)</span><span>0 / 2</span></div>
                    <div class="status-row"><span>CORE + CARDIO (肚子+有氧)</span><span>0 / 2</span></div>
                    <hr style="border: 0; border-top: 1px solid rgba(0, 240, 255, 0.2); margin: 15px 0;">
                    <div class="status-row"><span>TOTAL: 0 / 6</span><span>REST DAY: 0 / 1</span></div>
                </div>
            `;
        } else {
            contentDiv.innerHTML = `
                <div class="panel">
                    <h3>WEEKLY QUEST (SEP 14 — SEP 20)</h3>
                    <div class="status-row"><span>HAND (手)</span><span id="hand-count">0 / 2</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="hand-bar" style="width: 0%;"></div></div>
                    <div class="status-row"><span>LEG (腿)</span><span id="leg-count">0 / 2</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="leg-bar" style="width: 0%;"></div></div>
                    <div class="status-row"><span>CORE + CARDIO (肚子+有氧)</span><span id="core-count">0 / 2</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="core-bar" style="width: 0%;"></div></div>
                    <hr style="border: 0; border-top: 1px solid rgba(0, 240, 255, 0.2); margin: 15px 0;">
                    <div class="status-row"><span>TOTAL TRAINING: <strong id="total-training">0</strong> / 6</span><span>REST DAY: <strong id="rest-count">0</strong> / 1</span></div>
                </div>

                <div class="panel">
                    <h3>TODAY · ${dateString}</h3>
                    <div class="task-item">
                        <input type="checkbox" id="task-meditation">
                        <label for="task-meditation">MEDITATION (冥想 10分)</label>
                    </div>
                    <div class="task-item" style="flex-direction: column; align-items: flex-start; background: rgba(15, 23, 42, 0.8); padding: 10px; border-radius: 4px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.05);">
                        <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                            <input type="checkbox" id="task-bjj">
                            <label for="task-bjj">BJJ / 柔術影片 (30 MIN)</label>
                        </div>
                        <input type="text" placeholder="今天看了什麼？" style="width: 100%; margin-top: 8px; background: #030712; border: 1px solid rgba(0, 240, 255, 0.3); color: white; padding: 6px; border-radius: 4px;">
                    </div>
                    <div style="margin-top: 15px; border-top: 1px solid rgba(0, 240, 255, 0.2); padding-top: 15px;">
                        <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">TODAY'S SCHEDULED TRAINING</div>
                        <div id="today-target" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); margin-bottom: 10px; text-shadow: 0 0 8px rgba(0,240,255,0.4);">💪 HAND TRAINING (手)</div>
                        <button class="btn" onclick="completeTraining()">COMPLETE TRAINING</button>
                        <button class="btn btn-rest" onclick="enterRestMode()">ENTER REST MODE (休息)</button>
                    </div>
                </div>
            `;
        }

        let stats = { hand: 0, leg: 0, core: 0, rest: 0 };
        function completeTraining() {
            if (stats.hand < 2) {
                stats.hand++;
                document.getElementById('hand-count').innerText = stats.hand + " / 2";
                document.getElementById('hand-bar').style.width = (stats.hand / 2 * 100) + "%";
            } else if (stats.leg < 2) {
                stats.leg++;
                document.getElementById('leg-count').innerText = stats.leg + " / 2";
                document.getElementById('leg-bar').style.width = (stats.leg / 2 * 100) + "%";
            } else if (stats.core < 2) {
                stats.core++;
                document.getElementById('core-count').innerText = stats.core + " / 2";
                document.getElementById('core-bar').style.width = (stats.core / 2 * 100) + "%";
            }
            document.getElementById('total-training').innerText = (stats.hand + stats.leg + stats.core);
            alert("SYSTEM: 訓練已完成，EXP +100");
        }

        function enterRestMode() {
            if (stats.rest < 1) {
                stats.rest++;
                document.getElementById('rest-count').innerText = stats.rest;
                alert("⚠ REST MODE ACTIVATED: 今日訓練已順延。");
            } else {
                alert("本週休息額度已用完！");
            }
        }
    </script>
</body>
</html>
