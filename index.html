<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我獨自升級系統</title>
</head>
<body>

    <!-- 1. 在 HTML 裡隱藏音頻元素 -->
    <audio id="questSound" src="quest-complete.mp3" preload="auto"></audio>

    <!-- 2. 你的任務按鈕 -->
    <button onclick="completeTask()">完成每日任務</button>

    <script>
        function completeTask() {
            // 取得音效元素
            var audio = document.getElementById("questSound");
            
            // 每次點擊時將音效重頭播放
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.log("音效播放需要使用者互動解鎖：", error);
            });

            // 這裡可以放你原本「完成任務」的邏輯（例如彈出通知、加經驗值等）
            alert("【任務完成】您已獲得獎勵！");
        }
    </script>

</body>
</html>
