<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling System</title>
    <style>
        :root {
            --panel-bg: rgba(5, 10, 20, 0.94);
            --panel-border: #00f0ff;
            --panel-glow: rgba(0, 240, 255, 0.4);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #030712;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 16, 0.88);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .system-notification {
            background: var(--panel-bg);
            border: 2px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 0 30px var(--panel-glow), inset 0 0 25px rgba(0, 240, 255, 0.1);
            position: relative;
            transition: border-color 0.3s;
        }

        .system-notification::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
            pointer-events: none;
        }

        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .notif-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notif-icon {
            border: 1px solid var(--accent-cyan);
            border-radius: 50%;
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-weight: bold;
            box-shadow: 0 0 8px var(--accent-cyan);
            font-size: 0.9rem;
        }

        .notif-title {
            color: var(--accent-cyan);
            font-size: 1.05rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .player-title-badge {
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .progress-bar-bg {
            background-color: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            height: 10px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #0284c7, var(--accent-cyan));
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 6px;
            text-align: center;
            border-radius: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .task-box {
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .task-item input[type="checkbox"] {
            accent-color: var(--accent-cyan);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 100%;
            margin-top: 6px;
            background: #020617;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid var(--accent-cyan);
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .btn-rest {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
            margin-top: 4px;
        }

        .btn-rest:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        @keyframes flashEffect {
            0% { border-color: #fff; box-shadow: 0 0 40px #fff; }
            100% { border-color: var(--accent-cyan); box-shadow: 0 0 30px var(--panel-glow); }
        }
        .flashing {
            animation: flashEffect 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- 玩家狀態與屬性面板 -->
        <div class="system-notification" style="padding: 15px 20px;">
            <div class="notif-header" style="margin-bottom: 8px; border-bottom: none; padding-bottom: 0;">
                <span style="color: var(--accent-cyan); font-weight: bold; font-size: 0.95rem;" id="player-level-text">PLAYER LV. 07</span>
                <span class="player-title-badge" id="player-title">頭銜：覺醒者</span>
            </div>
            <div class="status-row" style="font-size: 0.85rem; margin-bottom: 4px;">
                <span>EXP</span>
                <span id="exp-text">72%</span>
            </div>
            <div class="progress-bar-bg" style="margin-bottom: 10px;">
                <div class="progress-bar-fill" id="exp-bar" style="width: 72%;"></div>
            </div>

            <!-- 微幅成長屬性表 -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">STR 力量</div>
                    <div class="stat-value" id="stat-str">12.4</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">AGI 敏捷</div>
                    <div class="stat-value" id="stat-agi">11.1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">VIT 體力</div>
                    <div class="stat-value" id="stat-vit">13.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">INT 感知</div>
                    <div class="stat-value" id="stat-int">10.5</div>
                </div>
            </div>
        </div>

        <!-- 每日任務面板 -->
        <div class="system-notification" id="quest-panel">
            <div class="notif-header">
                <div class="notif-title-group">
                    <div class="notif-icon">!</div>
                    <div class="notif-title">NOTIFICATION</div>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted);" id="date-label">SAT, SEP 12</div>
            </div>
            
            <!-- 今日建議訓練項目指示器 -->
            <div style="background: rgba(0, 240, 255, 0.08); border: 1px solid var(--accent-cyan); padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.8rem; color: var(--text-muted);">TODAY'S FOCUS:</span>
                <span id="today-focus-text" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-cyan);">⚡ CORE + CARDIO (核心與有氧)</span>
            </div>

            <!-- 冥想 -->
            <div class="task-box">
                <div class="task-item">
                    <input type="checkbox" id="task-meditation" onchange="saveData()">
                    <label for="task-meditation">🧘‍♂️ 冥想 (10 MIN)</label>
                </div>
            </div>

            <!-- 柔術影片 -->
            <div class="task-box">
                <div class="task-item">
                    <input type="checkbox" id="task-bjj" onchange="saveData()">
                    <label for="task-bjj">🥋 柔術影片學習 (30 MIN)</label>
                </div>
                <input type="text" id="bjj-note" placeholder="輸入今天學習心得或動作筆記..." oninput="saveData()">
            </div>

            <!-- 體能訓練進度 -->
            <div style="margin-top: 10px; border-top: 1px solid rgba(0,240,255,0.2); padding-top: 10px;">
                <div class="status-row"><span>HAND (手)</span><span id="hand-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="hand-bar" style="width: 0%;"></div></div>
                
                <div class="status-row"><span>LEG (腿)</span><span id="leg-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="leg-bar" style="width: 0%;"></div></div>
                
                <div class="status-row"><span>CORE + CARDIO (核心+有氧)</span><span id="core-count">0 / 2</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="core-bar" style="width: 0%;"></div></div>
                
                <div class="status-row" style="margin-top: 8px; font-weight: bold; color: var(--accent-cyan); font-size: 0.85rem;">
                    <span>TOTAL: <span id="total-training">0</span> / 6</span>
                    <span>REST: <span id="rest-count">0</span> / 1</span>
                </div>

                <button class="btn" onclick="completeTraining()">COMPLETE TRAINING (+1 PROGRESS)</button>
                <button class="btn btn-rest" onclick="enterRestMode()">ENTER REST MODE (休息)</button>
                <!-- 新增：手殘按錯時可以隨時取消休息模式 -->
                <button class="btn btn-rest" style="border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; margin-top: 4px;" onclick="cancelRestMode()">CANCEL REST (取消休息)</button>
            </div>
        </div>
    </div>

    <script>
        const now = new Date();
        const dayOfWeek = now.getDay();
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('date-label').innerText = now.toLocaleDateString('en-US', options).toUpperCase();

        const focusMap = {
            1: "💪 HAND (手部訓練)",
            2: "🦵 LEG (腿部訓練)",
            3: "⚡ CORE + CARDIO (核心與有氧)",
            4: "💪 HAND (手部訓練)",
            5: "🦵 LEG (腿部訓練)",
            6: "⚡ CORE + CARDIO (核心與有氧)",
            0: "🛡️ REST DAY (彈性休息日)"
        };
        document.getElementById('today-focus-text').innerText = focusMap[dayOfWeek];

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getFullYear(),0,1));
            var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            return `${d.getFullYear()}-W${weekNo}`;
        }
        const currentWeekNumber = getWeekNumber(now);

        let data = JSON.parse(localStorage.getItem('solo_system_data')) || {
            level: 7,
            exp: 72,
            str: 12.4,
            agi: 11.1,
            vit: 13.0,
            int: 10.5,
            hand: 0,
            leg: 0,
            core: 0,
            rest: 0,
            meditation: false,
            bjj: false,
            bjjNote: "",
            lastWeek: currentWeekNumber
        };

        if (data.lastWeek !== currentWeekNumber) {
            data.hand = 0;
            data.leg = 0;
            data.core = 0;
            data.rest = 0;
            data.meditation = false;
            data.bjj = false;
            data.lastWeek = currentWeekNumber;
            localStorage.setItem('solo_system_data', JSON.stringify(data));
        }

        function updateUI() {
            document.getElementById('player-level-text').innerText = `PLAYER LV. ${data.level < 10 ? '0' + data.level : data.level}`;
            document.getElementById('exp-text').innerText = data.exp + "%";
            document.getElementById('exp-bar').style.width = data.exp + "%";
            
            document.getElementById('stat-str').innerText = data.str.toFixed(1);
            document.getElementById('stat-agi').innerText = data.agi.toFixed(1);
            document.getElementById('stat-vit').innerText = data.vit.toFixed(1);
            document.getElementById('stat-int').innerText = data.int.toFixed(1);

            document.getElementById('hand-count').innerText = data.hand + " / 2";
            document.getElementById('hand-bar').style.width = (data.hand / 2 * 100) + "%";

            document.getElementById('leg-count').innerText = data.leg + " / 2";
            document.getElementById('leg-bar').style.width = (data.leg / 2 * 100) + "%";

            document.getElementById('core-count').innerText = data.core + " / 2";
            document.getElementById('core-bar').style.width = (data.core / 2 * 100) + "%";

            const total = data.hand + data.leg + data.core;
            document.getElementById('total-training').innerText = total;
            document.getElementById('rest-count').innerText = data.rest;

            document.getElementById('task-meditation').checked = data.meditation;
            document.getElementById('task-bjj').checked = data.bjj;
            document.getElementById('bjj-note').value = data.bjjNote;

            let title = "覺醒者";
            if (data.level >= 10) title = "二階獵人";
            if (total >= 4) title = "超越極限者";
            if (data.rest > 0) title = "暫避鋒芒者";
            document.getElementById('player-title').innerText = `頭銜：${title}`;
        }

        function saveData() {
            data.meditation = document.getElementById('task-meditation').checked;
            data.bjj = document.getElementById('task-bjj').checked;
            data.bjjNote = document.getElementById('bjj-note').value;
            localStorage.setItem('solo_system_data', JSON.stringify(data));
        }

        function triggerFlash() {
            const panel = document.getElementById('quest-panel');
            panel.classList.add('flashing');
            setTimeout(() => panel.classList.remove('flashing'), 400);
        }

        function completeTraining() {
            triggerFlash();
            
            if (data.hand < 2) { 
                data.hand++; 
                data.str += 0.2; 
            } else if (data.leg < 2) { 
                data.leg++; 
                data.vit += 0.2; 
            } else if (data.core < 2) { 
                data.core++; 
                data.agi += 0.15; 
            } else {
                alert("本週訓練配額已全部完成！");
                return;
            }

            data.exp += 15;
            if (data.exp >= 100) {
                data.level++;
                data.exp = 0;
                alert(`🎉 恭喜！等級提升至 LV. ${data.level}！`);
            } else {
                alert("SYSTEM: 訓練進度登錄成功，EXP +15。");
            }

            saveData();
            updateUI();
        }

        function enterRestMode() {
            if (data.rest < 1) {
                data.rest++;
                data.vit += 0.1;
                triggerFlash();
                alert("⚠ REST MODE ACTIVATED: 本週休息額度已使用。");
                saveData();
                updateUI();
            } else {
                alert("本週休息額度已用完！");
            }
        }

        // 新增：取消休息模式並扣回剛剛多加的微幅體力
        function cancelRestMode() {
            if (data.rest > 0) {
                data.rest = 0;
                data.vit = Math.max(10, data.vit - 0.1); // 扣回休息送的微幅體力，避免被刷分
                triggerFlash();
                alert("SYSTEM: 已取消休息模式，恢復訓練狀態。");
                saveData();
                updateUI();
            } else {
                alert("目前並未處於休息狀態！");
            }
        }

        updateUI();
    </script>
</body>
</html>
